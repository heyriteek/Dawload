<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Insta Downloader</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #fff; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #1e293b; padding: 25px; border-radius: 12px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { text-align: center; margin-top: 0; color: #38bdf8; }
    label { font-size: 14px; color: #94a3b8; display: block; margin-top: 15px; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; background: #0284c7; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .hidden { display: none; }
    .msg { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
    .logout-btn { background: #dc2626; margin-top: 10px; }
    .logout-btn:hover { background: #b91c1c; }
  </style>
</head>
<body>

<div class="card">
  <h2>Admin Panel</h2>

  <!-- LOGIN FORM -->
  <div id="login-form">
    <label>Admin Email</label>
    <input type="email" id="email" placeholder="mrriteek82@gmail.com">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••">
    <button onclick="login()">Login</button>
  </div>

  <!-- DASHBOARD FORM -->
  <div id="dashboard" class="hidden">
    <label>RapidAPI Key</label>
    <input type="text" id="apiKey" placeholder="9cd65b01aemsh6007cb...">

    <label>RapidAPI Host</label>
    <input type="text" id="apiHost" placeholder="instagram-downloader-download-instagram-stories-videos4.p.rapidapi.com">

    <label>Notice Banner Message</label>
    <textarea id="notice" rows="2" placeholder="Clean & Fast Downloader Active!"></textarea>

    <button onclick="saveData()">Save Changes</button>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div id="status-msg" class="msg"></div>
</div>

<!-- FIREBASE SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<script>
  // FIREBASE CONFIG (Updated)
  const firebaseConfig = {
    apiKey: "AIzaSyAMk0VFAi54nYovyErqfFD0KPmRelM8Uvg",
    authDomain: "dawload-8b47d.firebaseapp.com",
    databaseURL: "https://dawload-8b47d-default-rtdb.firebaseio.com",
    projectId: "dawload-8b47d",
    storageBucket: "dawload-8b47d.firebasestorage.app",
    messagingSenderId: "504882478942",
    appId: "1:504882478942:web:24d8fea2edf0f7ebf559cf",
    measurementId: "G-1BHK6JJBLV"
  };
  
  // Single initialization check
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Helper for user-friendly error messages
  function getFriendlyErrorMessage(error) {
    if (!error || !error.code) return error.message || "An unexpected error occurred.";
    switch (error.code) {
      case 'auth/api-key-not-valid':
        return "Invalid API Key. Please verify your Firebase configuration.";
      case 'auth/user-not-found':
      case 'auth/wrong-password':
      case 'auth/invalid-credential':
        return "Invalid email or password. Please try again.";
      case 'auth/invalid-email':
        return "Please enter a valid email address.";
      case 'auth/user-disabled':
        return "This account has been disabled.";
      case 'auth/too-many-requests':
        return "Too many failed attempts. Please try again later.";
      case 'auth/network-request-failed':
        return "Network error. Please check your internet connection.";
      default:
        return error.message;
    }
  }

  // Auth State Listener
  auth.onAuthStateChanged((user) => {
    if (user) {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      loadSettings();
    } else {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('dashboard').classList.add('hidden');
    }
  });

  // Login
  function login() {
    const e = document.getElementById('email').value.trim();
    const p = document.getElementById('password').value;
    const msg = document.getElementById('status-msg');

    if (!e || !p) {
      msg.style.color = '#f87171';
      msg.innerText = "Please enter both email and password.";
      return;
    }
    
    msg.style.color = '#38bdf8';
    msg.innerText = "Logging in...";

    auth.signInWithEmailAndPassword(e, p)
      .then(() => { 
        msg.style.color = '#4ade80'; 
        msg.innerText = "Login Successful!"; 
      })
      .catch((err) => { 
        msg.style.color = '#f87171'; 
        msg.innerText = getFriendlyErrorMessage(err); 
      });
  }

  // Load Settings from Firestore
  function loadSettings() {
    const msg = document.getElementById('status-msg');
    db.collection('settings').doc('config').get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        document.getElementById('apiKey').value = data.apiKey || '';
        document.getElementById('apiHost').value = data.apiHost || '';
        document.getElementById('notice').value = data.notice || '';
      }
    }).catch((err) => {
      msg.style.color = '#f87171';
      msg.innerText = "Failed to load settings: " + getFriendlyErrorMessage(err);
    });
  }

  // Save Settings to Firestore
  function saveData() {
    const msg = document.getElementById('status-msg');
    msg.style.color = '#38bdf8';
    msg.innerText = "Saving changes...";

    db.collection('settings').doc('config').set({
      apiKey: document.getElementById('apiKey').value.trim(),
      apiHost: document.getElementById('apiHost').value.trim(),
      notice: document.getElementById('notice').value.trim()
    }, { merge: true }).then(() => {
      msg.style.color = '#4ade80';
      msg.innerText = "Settings saved successfully!";
      setTimeout(() => { if (msg.innerText === "Settings saved successfully!") msg.innerText = ""; }, 3000);
    }).catch((err) => {
      msg.style.color = '#f87171';
      msg.innerText = getFriendlyErrorMessage(err);
    });
  }

  // Logout
  function logout() {
    const msg = document.getElementById('status-msg');
    auth.signOut().then(() => {
      msg.innerText = "";
    }).catch((err) => {
      msg.style.color = '#f87171';
      msg.innerText = getFriendlyErrorMessage(err);
    });
  }
</script>
</body>
</html>
