<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insta Downloader - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #030712; color: #f8fafc; min-height: 100vh; padding: 20px 12px; display: flex; justify-content: center; align-items: center; }
    
    .admin-card {
      width: 100%;
      max-width: 480px;
      background: #0d1527;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.7);
    }

    .login-box { text-align: center; display: block; }
    .login-box h2 { font-size: 22px; color: #fff; margin-bottom: 8px; font-weight: 800; }
    .login-box p { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    
    .login-input {
      width: 100%;
      padding: 14px;
      background: #070c18;
      border: 1.5px solid #2a3853;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      margin-bottom: 16px;
    }
    .login-input:focus { border-color: #a855f7; }

    .btn-login {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .dashboard-content { display: none; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1e293b; padding-bottom: 14px; }
    .admin-header h2 { font-size: 18px; color: #c084fc; font-weight: 800; }
    .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #059669; }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      background: #070c18;
      border: 1.5px solid #2a3853;
      border-radius: 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: #a855f7; }

    .toggle-card { display: flex; align-items: center; justify-content: space-between; background: #070c18; padding: 14px; border-radius: 12px; border: 1px solid #2a3853; margin-bottom: 16px; }
    .toggle-card-info h4 { font-size: 13px; font-weight: 700; color: #fff; }
    .toggle-card-info p { font-size: 10px; color: #64748b; margin-top: 2px; }

    .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #a855f7; }
    input:checked + .slider:before { transform: translateX(20px); }

    .btn-save {
      width: 100%;
      height: 50px;
      background: linear-gradient(135deg, #a855f7, #ec4899);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
    }
    .btn-save:active { transform: scale(0.98); }
    .toast { display: none; text-align: center; margin-top: 14px; color: #34d399; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>

  <div class="admin-card">
    
    <!-- LOGIN SCREEN -->
    <div id="loginBox" class="login-box">
      <h2>🔐 Admin Login</h2>
      <p>Enter security PIN to access control panel</p>
      <input type="password" id="adminPass" class="login-input" placeholder="Enter Admin Password">
      <button class="btn-login" onclick="checkPassword()">Unlock Panel</button>
    </div>

    <!-- DASHBOARD PANEL -->
    <div id="dashboardContent" class="dashboard-content">
      <div class="admin-header">
        <h2>⚙️ Admin Control Center</h2>
        <span class="status-badge">Connected</span>
      </div>

      <!-- RAPIDAPI CONFIGURATION -->
      <div class="form-group">
        <label>RAPIDAPI KEY</label>
        <input type="text" id="apiKey" placeholder="Paste RapidAPI Key here...">
      </div>

      <div class="form-group">
        <label>RAPIDAPI HOST</label>
        <input type="text" id="apiHost" placeholder="e.g. instagram-downloader.p.rapidapi.com">
      </div>

      <!-- FORCE COMING SOON / MAINTENANCE TOGGLE -->
      <div class="toggle-card">
        <div class="toggle-card-info">
          <h4>🚀 Force "Coming Soon" Mode</h4>
          <p>Enable if API limit finished or server updating</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="maintenanceMode">
          <span class="slider"></span>
        </label>
      </div>

      <!-- ANNOUNCEMENT BANNER CONTROL -->
      <div class="toggle-card">
        <div class="toggle-card-info">
          <h4>📢 Show Top Notice Banner</h4>
          <p>Display custom notice on app top</p>
        </div>
        <label class="switch">
          <input type="checkbox" id="showNotice">
          <span class="slider"></span>
        </label>
      </div>

      <div class="form-group">
        <label>NOTICE BANNER TEXT</label>
        <textarea id="noticeText" rows="2" placeholder="e.g. 🔥 Fast HD Instagram Downloader Active!"></textarea>
      </div>

      <button class="btn-save" onclick="saveSettings()">💾 Save Settings</button>
      <div id="toast" class="toast">✅ Firebase Updated Successfully!</div>
    </div>

  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const SECRET_PIN = "mohit123";

    function checkPassword() {
      const inputPass = document.getElementById('adminPass').value.trim();
      if (inputPass === SECRET_PIN) {
        document.getElementById('loginBox').style.display = "none";
        document.getElementById('dashboardContent').style.display = "block";
        loadFirebaseData();
      } else {
        alert("Wrong Password! Access Denied.");
      }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyAMk0VFAi54nYovyErqfFD06x-vHlh1m9c",
      authDomain: "dawload-8b47d.firebaseapp.com",
      projectId: "dawload-8b47d",
      storageBucket: "dawload-8b47d.firebasestorage.app",
      messagingSenderId: "504882478942",
      appId: "1:504882478942:web:24d8fea2edf0f7ebf559cf"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadFirebaseData() {
      db.collection('settings').doc('config').get().then((doc) => {
        if (doc.exists) {
          const data = doc.data();
          document.getElementById('apiKey').value = data.apiKey || '';
          document.getElementById('apiHost').value = data.apiHost || '';
          document.getElementById('maintenanceMode').checked = data.maintenanceMode || false;
          document.getElementById('showNotice').checked = data.showNotice || false;
          document.getElementById('noticeText').value = data.noticeText || '';
        }
      }).catch((err) => {
        console.error("Fetch error:", err);
      });
    }

    async function saveSettings() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const apiHost = document.getElementById('apiHost').value.trim();
      const maintenanceMode = document.getElementById('maintenanceMode').checked;
      const showNotice = document.getElementById('showNotice').checked;
      const noticeText = document.getElementById('noticeText').value.trim();

      if (!apiKey || !apiHost) {
        alert("Please enter both API Key and API Host before saving!");
        return;
      }

      try {
        await db.collection('settings').doc('config').set({
          apiKey: apiKey,
          apiHost: apiHost,
          maintenanceMode: maintenanceMode,
          showNotice: showNotice,
          noticeText: noticeText,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 3000);
      } catch (error) {
        alert("Firebase Save Error: " + error.message + "\n\nCheck Firebase Firestore Rules!");
      }
    }
  </script>
</body>
</html>
