<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Instagram Downloader</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0b0f19; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .notice-bar { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 20px; border-radius: 30px; font-size: 14px; margin-bottom: 30px; text-align: center; }
    .container { background: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 30px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { margin-top: 0; font-size: 24px; background: linear-gradient(to right, #f43f5e, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #9ca3af; font-size: 14px; }
    .input-box { display: flex; gap: 8px; margin-top: 20px; }
    input { flex: 1; padding: 12px 15px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 14px; outline: none; }
    button { padding: 12px 20px; border: none; border-radius: 8px; background: linear-gradient(to right, #ec4899, #8b5cf6); color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; }
    .result { margin-top: 25px; display: none; }
    video { width: 100%; border-radius: 8px; margin-bottom: 12px; }
    .download-btn { display: inline-block; width: 100%; text-decoration: none; padding: 12px; background: #10b981; color: #fff; font-weight: bold; border-radius: 8px; }
    .loader { display: none; margin-top: 15px; color: #a855f7; font-weight: bold; }
  </style>
</head>
<body>

  <div id="notice-banner" class="notice-bar">Loading Notice...</div>

  <div class="container">
    <h1>Instagram Downloader</h1>
    <p>Paste any Instagram Reel or Video Link below</p>
    
    <div class="input-box">
      <input type="text" id="instaUrl" placeholder="https://www.instagram.com/reel/...">
      <button onclick="downloadVideo()">Download</button>
    </div>

    <div id="loader" class="loader">Fetching Video...</div>

    <div id="result" class="result">
      <video id="videoPlayer" controls></video>
      <a id="downloadLink" class="download-btn" target="_blank" download>Save Video</a>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    // YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyAMk0VFAi54nYovyErqfFD06x-vHlh1m9c",
      authDomain: "dawload-8b47d.firebaseapp.com",
      projectId: "dawload-8b47d",
      storageBucket: "dawload-8b47d.firebasestorage.app",
      messagingSenderId: "504882478942",
      appId: "1:504882478942:web:24d8fea2edf0f7ebf559cf",
      measurementId: "G-1BHK6JJBLV"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let apiKey = "";
    let apiHost = "";

    // Load config from Firestore
    db.collection('settings').doc('config').get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        apiKey = data.apiKey;
        apiHost = data.apiHost;
        document.getElementById('notice-banner').innerText = data.notice || "Ad-Free Instagram Downloader";
      }
    });

    async function downloadVideo() {
      const url = document.getElementById('instaUrl').value.trim();
      const loader = document.getElementById('loader');
      const result = document.getElementById('result');
      
      if (!url) return alert("Please paste an Instagram URL!");
      if (!apiKey || !apiHost) return alert("System setup pending from Admin Panel!");

      loader.style.display = "block";
      result.style.display = "none";

      try {
        const response = await fetch(`https://${apiHost}/?url=${encodeURIComponent(url)}`, {
          method: 'GET',
          headers: {
            'x-rapidapi-key': apiKey,
            'x-rapidapi-host': apiHost
          }
        });
        
        const data = await response.json();
        loader.style.display = "none";

        if (data && (data.media || data.download_url || data[0]?.url)) {
          const videoUrl = data.media || data.download_url || data[0]?.url;
          document.getElementById('videoPlayer').src = videoUrl;
          document.getElementById('downloadLink').href = videoUrl;
          result.style.display = "block";
        } else {
          alert("Could not fetch video. Make sure the link is public!");
        }
      } catch (err) {
        loader.style.display = "none";
        alert("Error fetching video. Check API limits or Host URL.");
      }
    }
  </script>
</body>
</html>
