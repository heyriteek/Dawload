<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaSaver - Premium Downloader</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body { background: #07090e; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 15px; }
    
    .notice-bar { 
      background: rgba(30, 41, 59, 0.7); 
      backdrop-filter: blur(10px); 
      color: #38bdf8; 
      border: 1px solid rgba(56, 189, 248, 0.2); 
      padding: 8px 18px; 
      border-radius: 50px; 
      font-size: 13px; 
      font-weight: 500; 
      margin-bottom: 25px; 
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .container { 
      background: #111827; 
      border: 1px solid #1f2937; 
      border-radius: 20px; 
      padding: 25px; 
      width: 100%; 
      max-width: 440px; 
      text-align: center; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
    }

    h1 { 
      font-size: 26px; 
      font-weight: 800; 
      background: linear-gradient(135deg, #f43f5e, #a855f7, #3b82f6); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      margin-bottom: 6px; 
    }

    p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 22px; }

    .input-group { 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      width: 100%; 
    }

    input { 
      width: 100%; 
      padding: 14px 16px; 
      border-radius: 12px; 
      border: 1px solid #334155; 
      background: #0f172a; 
      color: #fff; 
      font-size: 14px; 
      outline: none; 
      transition: all 0.3s ease;
    }

    input:focus { 
      border-color: #a855f7; 
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.3); 
    }

    .btn-fetch { 
      width: 100%; 
      padding: 14px; 
      border: none; 
      border-radius: 12px; 
      background: linear-gradient(135deg, #ec4899, #8b5cf6); 
      color: #fff; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: transform 0.2s, opacity 0.2s; 
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.3);
    }

    .btn-fetch:active { transform: scale(0.98); }

    .result { margin-top: 25px; display: none; }

    .media-box { 
      width: 100%; 
      max-height: 420px; 
      border-radius: 14px; 
      overflow: hidden; 
      background: #000; 
      margin-bottom: 16px; 
      border: 1px solid #1f2937;
    }

    video, img { width: 100%; max-height: 420px; object-fit: contain; display: block; }

    .btn-download { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      width: 100%; 
      text-decoration: none; 
      padding: 14px; 
      background: linear-gradient(135deg, #10b981, #059669); 
      color: #fff; 
      font-size: 15px; 
      font-weight: 700; 
      border-radius: 12px; 
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
      transition: transform 0.2s;
    }

    .btn-download:active { transform: scale(0.98); }

    .loader { 
      display: none; 
      margin-top: 20px; 
      color: #c084fc; 
      font-size: 14px; 
      font-weight: 600; 
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

  <div id="notice-banner" class="notice-bar">Connecting to Server...</div>

  <div class="container">
    <h1>Insta Downloader</h1>
    <p class="subtitle">Paste Instagram Reel, Video or Photo link below</p>
    
    <div class="input-group">
      <input type="text" id="instaUrl" placeholder="https://www.instagram.com/reel/...">
      <button class="btn-fetch" onclick="downloadVideo()">Fetch Media</button>
    </div>

    <div id="loader" class="loader">⚡ Fetching High Speed Link...</div>

    <div id="result" class="result">
      <div id="mediaContainer" class="media-box"></div>
      <a id="downloadLink" class="btn-download" target="_blank" download="Instagram_Media.mp4">📥 Download File</a>
    </div>
  </div>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAMk0VFAi54nYovyErqfFD06x-vHlh1m9c",
      authDomain: "dawload-8b47d.firebaseapp.com",
      projectId: "dawload-8b47d",
      storageBucket: "dawload-8b47d.firebasestorage.app",
      messagingSenderId: "504882478942",
      appId: "1:504882478942:web:24d8fea2edf0f7ebf559cf",
      measurementId: "G-1BHK6JJBLV"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let apiKey = "";
    let apiHost = "";

    // Fetch dynamic config from Firestore
    db.collection('settings').doc('config').get().then((doc) => {
      if (doc.exists) {
        const data = doc.data();
        apiKey = data.apiKey;
        apiHost = data.apiHost;
        document.getElementById('notice-banner').innerText = data.notice || "⚡ Fast & Free Downloader Active";
      }
    });

    async function downloadVideo() {
      const url = document.getElementById('instaUrl').value.trim();
      const loader = document.getElementById('loader');
      const result = document.getElementById('result');
      const mediaContainer = document.getElementById('mediaContainer');
      const downloadLink = document.getElementById('downloadLink');

      if (!url) return alert("Please paste an Instagram URL!");
      if (!apiKey || !apiHost) return alert("System setup pending from Admin Panel!");

      loader.style.display = "block";
      result.style.display = "none";
      mediaContainer.innerHTML = "";

      try {
        const response = await fetch(`https://${apiHost}/convert?url=${encodeURIComponent(url)}`, {
          method: 'GET',
          headers: {
            'x-rapidapi-key': apiKey,
            'x-rapidapi-host': apiHost
          }
        });
        
        const data = await response.json();
        loader.style.display = "none";

        let mediaItem = null;
        if (data.media && data.media.length > 0) {
          mediaItem = data.media[0];
        }

        if (mediaItem && mediaItem.url) {
          const finalUrl = mediaItem.url;
          
          if (mediaItem.type === "image") {
            mediaContainer.innerHTML = `<img src="${finalUrl}" alt="Instagram Post">`;
            downloadLink.setAttribute('download', 'Instagram_Photo.jpg');
          } else {
            mediaContainer.innerHTML = `<video src="${finalUrl}" controls autoplay muted></video>`;
            downloadLink.setAttribute('download', 'Instagram_Video.mp4');
          }

          downloadLink.href = finalUrl;
          result.style.display = "block";
        } else {
          alert("Could not fetch media. Make sure the link is public!");
        }
      } catch (err) {
        loader.style.display = "none";
        alert("Error fetching media. Check API limits or URL.");
      }
    }
  </script>
</body>
</html>
